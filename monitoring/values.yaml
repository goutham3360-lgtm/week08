# kube-prometheus-stack values for KoalaTech (Task 10.2D)
# Sized for a small AKS cluster. Control-plane components that AKS
# does not expose (etcd, scheduler, controller-manager, kube-proxy) are disabled.
fullnameOverride: kps

alertmanager:
  enabled: false

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    # Discover ServiceMonitors in any namespace, not only ones labelled for this Helm release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi